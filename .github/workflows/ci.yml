name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  fast-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contract Checks
        run: npm run check:contracts

      - name: Import Boundary Checks
        run: npm run check:boundaries

      - name: Docs Link Checks
        run: npm run check:docs

      - name: Lint
        run: npm run lint

      - name: Unit and Smoke Tests
        run: npm test

      - name: Repeat-Run Risky Unit Suites
        run: node scripts/repeat-risky-unit-suites.js

  self-contained-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Self-Contained Integration Tests
        run: npm run test:integration:self-contained
