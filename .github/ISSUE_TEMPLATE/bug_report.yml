name: Bug Report
description: Report a defect in Switchmaxxer behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.
        Please include the smallest reproducible case you can.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A short description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      description: Include commands, config snippets, and request payloads if relevant
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: surface
    attributes:
      label: Affected Surface
      description: Which surface is involved?
      placeholder: CLI, gateway runtime, MCP, observability, config mutation, docs, other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs Or JSON Output
      description: Paste the most relevant output, redacting secrets first
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node version, and any relevant setup details
      placeholder: |
        OS:
        Node:
        Install method:
        Test tier:

